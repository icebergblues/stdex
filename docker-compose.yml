name: examen-final

services:

  postgres:
    image: postgres:17.7
    container_name: examen-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 9876
      POSTGRES_DB: todo-db
    volumes:
      - "postgres_data_examen:/var/lib/postgresql/data"
    ports:
      - "54321:5432"

  consul:
    image: consul:1.15.4
    container_name: examen-consul
    command: |
      agent -dev
      -ui
      -bind 0.0.0.0
      -client 0.0.0.0
    ports:
      - "8500:8500"

  app-todos-1:
    image: jaimesalvador/app-todos:latest
    build:
      context: .
      dockerfile: src/main/docker/Dockerfile.jvm
    container_name: examen-app-todos-1
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/todo-db
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: postgres
      QUARKUS_HTTP_PORT: "8080"
      CONSUL_HOST: consul
      CONSUL_PORT: "8500"
      APP_INSTANCE_ID: app-todos-1
    ports:
      - "8081:8080"

  app-todos-2:
    image: jaimesalvador/app-todos:latest
    build:
      context: .
      dockerfile: src/main/docker/Dockerfile.jvm
    container_name: examen-app-todos-2
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/todo-db
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: postgres
      QUARKUS_HTTP_PORT: "8080"
      CONSUL_HOST: consul
      CONSUL_PORT: "8500"
      APP_INSTANCE_ID: app-todos-2
    ports:
      - "8082:8080"

  traefik:
    image: traefik:v3.3
    container_name: examen-traefik
    command:
      --api.insecure=true
      --api.dashboard=true
      --providers.consulCatalog
      --providers.consulCatalog.endpoint.address=consul:8500
      --providers.consulCatalog.exposedByDefault=false
      --providers.consulCatalog.refreshInterval=5s
    ports:
      - 8888:80
      - 8083:8080

  prometheus:
    image: prom/prometheus:latest
    container_name: examen-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

volumes:
  postgres_data_examen:
