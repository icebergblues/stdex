quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/todo-db
quarkus.datasource.username=postgres
quarkus.datasource.password=9876

# Flyway: migracion automatica al arrancar (idempotente, se ejecuta solo una vez)
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration
quarkus.flyway.baseline-on-migrate=true

# Validar esquema contra las entidades (las migraciones son la fuente de verdad)
quarkus.hibernate-orm.log.sql=false

quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# CORS
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,HEAD

# Service Discovery via Stork + Consul
#quarkus.stork.users-api.service-discovery.type=consul
#quarkus.stork.users-api.service-discovery.consul-host=${consul.host}
#quarkus.stork.users-api.service-discovery.consul-port=${consul.port}
#quarkus.stork.users-api.service-discovery.refresh-period=10s

users-api.url.lb=https://jsonplaceholder.typicode.com
quarkus.stork.users-api.service-discovery.type=static
quarkus.stork.users-api.service-discovery.address-list=${users-api.url.lb}
quarkus.stork.users-api.load-balancer.type=round-robin
